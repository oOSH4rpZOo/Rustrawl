[package]
name = "rustrawl"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Internal network discovery tool: wide SYN sweep, /24 expansion, operator-driven nmap fingerprinting"

# Target dependencies (land with their modules):
# roaring, rusqlite bundled (the only allowed C, musl-friendly), tokio
# (the scan stage), tracing, thiserror.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
libc = "0.2"
pnet_packet = "0.35"
rand = "0.8"
rand_chacha = "0.3"
fs2 = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
roaring = "0.11.5"
# Line editing + history for the db console — pure Rust (the only allowed C
# stays the bundled sqlite).
rustyline = { version = "16", default-features = false, features = ["with-file-history"] }
